name: Release Version

on:
    push:
        tags:
            - "v*.*.*"
env:
    NAME: uias

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout repository"
              uses: actions/checkout@v4.1.1

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "20.x"

            - name: npm install
              run: npm install

            - name: Get tag version
              id: branch-names
              uses: tj-actions/branch-names@v8
              with:
                  strip_tag_prefix: v

            - name: build
              run: npm run build

            - name: Pack Compression
              run: |
                  mv dist ${{ env.NAME }}
                  tar zcvf ${{ env.NAME }}-${{ steps.branch-names.outputs.tag }}.tar.gz ${{ env.NAME }}

            - name: build rpm package
              run: |
                  docker run -it --rm \
                    -v "$(pwd)/.cid/uias.spec:/root/rpmbuild/SPECS/uias.spec" \
                    -v "$(pwd)/${{ env.NAME }}-${{ steps.branch-names.outputs.tag }}.tar.gz:/root/rpmbuild/SOURCES/${{ env.NAME }}-${{ steps.branch-names.outputs.tag }}.tar.gz" \
                    -v "$(pwd)/rpms:/root/rpmbuild/RPMS" \
                    -w /root/rpmbuild \
                    outsrkem/rpmbuild:4.14.3-rocky8 \
                    bash -c "rpmbuild -bb \
                    --define \"_version ${{ steps.branch-names.outputs.tag }}\" \
                    --define \"_release 1\" \
                    --define \"dist .el6\" \
                    --define \"_packager LiHua\" \
                    --define \"_email lark@email.com\" SPECS/uias.spec"

            - name: Upload
              env:
                  AK: ${{ secrets.HW_ACCESS_KEY_ID }}
                  SK: ${{ secrets.HW_SECRET_ACCESS_KEY }}
              run: |
                  wget "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz"
                  tar -xzvf obsutil_linux_amd64.tar.gz
                  mv obsutil_linux_amd64_* obsutil
                  chmod 755 obsutil/obsutil
                  ./obsutil/obsutil config -i=$AK -k=$SK -e=obs.cn-north-4.myhuaweicloud.com
                  find . -type f \( -name "uias-*.gz" -o -name "uias-*.rpm" \) | while read file; do
                    echo "uploading $file"
                    ./obsutil/obsutil cp "$file" obs://110254b2cf424535aec05afe14ab8497/${{ env.NAME }}/
                  done
